  default_severity: S2
- id: AI-004
  category: AI
  name: 丢失目标后敌人永久保持错误仇恨/追击状态
  applicable_features:
  - ai
  - combat
  - line_of_sight
  triggers:
  - target_hidden
  - target_out_of_detection
  - los_lost
  oracle: 超过项目 target-loss timeout 后，AI 应进入项目声明的 search/idle/disengage 等恢复状态
  evidence:
  - ai_telemetry
  - state
  - timer
  - video
  default_severity: S2
- id: AI-005
  category: AI
  name: 导航路径变化后敌人不重寻路或错误认为路径完成
  applicable_features:
  - ai
  - navigation
  triggers:
  - dynamic_obstacle
  - door_close
  - path_invalidated
  oracle: 路径失效/环境变化后的处理必须符合项目重寻路契约，不得永久卡死或错误进入到达态
  evidence:
  - ai_telemetry
  - path_status
  - remaining_distance
  - video
  default_severity: S2
- id: PHY-006
  category: PHY
  name: 重力弹道落点或飞行时间偏离项目声明模型
  applicable_features:
  - projectile
  - combat
  - physics
  triggers:
  - gravity_projectile
  - long_range
  - arc_shot
  oracle: 仅当项目声明标准弹道参数/轨迹真值时，实际 impact point / flight time 应落在允许误差内
  evidence:
  - projectile_telemetry
  - impact_point
  - flight_time
  - video
  default_severity: S2
- id: PHY-007
  category: PHY
  name: 投射物穿透层数超过项目允许上限
  applicable_features:
  - projectile
  - combat
  - physics
  triggers:
  - multiple_walls
  - penetration
  - thin_obstacles
  oracle: 当遮挡层数大于 max_penetration_layers 时，目标不得收到该投射物伤害；允许层数内则按项目契约执行
  evidence:
  - projectile_telemetry
  - penetration_count
  - target_hp
  - hit_order
  default_severity: S1
- id: PHY-008
  category: PHY
  name: 投射物命中点明显偏离目标表面或项目参考点
  applicable_features:
  - projectile
  - combat
  - physics
  triggers:
  - edge_hit
  - small_target
  - moving_target
  oracle: 当项目提供预期 impact reference 时，实际 impact point 与参考点距离应在 tolerance 内
  evidence:
  - impact_point
  - expected_point
  - collider
  - video
  default_severity: S2
- id: AI-006
  category: AI
  name: 动态障碍改变路径后 AI 未按契约重寻路
  applicable_features:
  - ai
  - navigation
  triggers:
  - dynamic_obstacle
  - door_close
  - navmesh_carving
  - path_change
  oracle: 动态障碍生效后，若项目要求重寻路且仍存在可行路径，应在 replan window 内出现重规划/替代路径并继续取得进展
  evidence:
  - ai_telemetry
  - replan_count
  - path_status
  - position
  - video
  default_severity: S1
- id: AI-007
  category: AI
  name: 多 Agent 在可达目标前形成永久拥堵或无进展
  applicable_features:
  - ai
  - navigation
  - crowd
  triggers:
  - many_agents
  - narrow_passage
  - same_destination
  oracle: 在项目声明的 crowd timeout 内，到达比例/整体进展应达到最低阈值，不得形成永久死锁
  evidence:
  - crowd_telemetry
  - arrived_count
  - agent_positions
  - video
  default_severity: S1
- id: AI-008
  category: AI
  name: Crowd 持续严重重叠并违反项目最小分离约束
  applicable_features:
  - ai
  - navigation
  - crowd
  triggers:
  - dense_spawn
  - same_destination
  - local_avoidance
  oracle: 仅当项目声明 min_separation 时，运行期观测的最小分离距离不得持续低于允许阈值
  evidence:
  - crowd_telemetry
  - min_separation
  - positions
  - video
  default_severity: S2
- id: GAME-007
  category: GAME
  name: AOE 半径边界伤害判定错误
  applicable_features:
  - combat
  - aoe
  - projectile
  triggers:
  - explosion
  - radius_boundary
  - area_damage
  oracle: 目标位于项目声明 AOE 半径内/外时，真实伤害结果应分别符合 inside/outside 契约
  evidence:
  - target_hp
  - damage_event
  - distance
  - screenshot
  default_severity: S2
- id: SAVE-006
  category: SAVE
  name: 存档损坏后未按项目契约恢复、拒绝或回退
  applicable_features:
  - save_load
  - recovery
  triggers:
  - corrupt_primary_save
  - truncated_save
  - checksum_failure
  oracle: 当存档损坏可被检测时，加载行为必须符合项目 recovery contract：例如回退到有效备份、干净拒绝或进入显式恢复流程，不得静默加载混合/损坏状态
  evidence:
  - save_telemetry
  - disk_snapshot
  - runtime_snapshot
  - log
  default_severity: S0
- id: SAVE-007
  category: SAVE
  name: 旧版本存档迁移后关键字段丢失、错映射或版本号异常
  applicable_features:
  - save_load
  - migration
  - update
  triggers:
  - load_old_schema
  - version_upgrade
  - save_migration
  oracle: 给定项目声明的 legacy fixture 与 migration contract，迁移后的关键字段和值、schema version 必须符合目标版本规则
  evidence:
  - legacy_snapshot
  - migrated_snapshot
  - schema_version
  - migration_log
  default_severity: S0
- id: SAVE-008
  category: SAVE
  name: 仅会话态数据错误跨进程/新会话持久化
  applicable_features:
  - save_load
  - session_state
  triggers:
  - restart_session
  - new_game_session
  - temporary_buff_or_combo
  oracle: 项目声明为 session-only / transient 的字段在新会话启动后必须回到其默认或初始化状态，不得从持久化快照泄漏回来
  evidence:
  - before_after_state
  - runtime_snapshot
  - save_snapshot
  default_severity: S2
- id: NET-007
  category: NET
  name: 结算/领奖与断线重连竞态造成奖励重复或丢失
  applicable_features:
  - network
  - reward
  - match_end
  triggers:
  - match_end_disconnect
  - reconnect_during_reward
  - retry_after_timeout
  oracle: 同一结算/奖励业务键在服务端权威账本中只能完成一次，重连后客户端最终与权威结果一致
  evidence:
  - server_ledger
  - request_id
  - client_state
  - network_log
  default_severity: S0
- id: NET-008
  category: NET
  name: 多人同时拾取或交互导致同一对象被重复拥有/重复结算
  applicable_features:
  - multiplayer
  - pickup
  - interaction
  triggers:
  - simultaneous_pickup
  - simultaneous_interact
  oracle: 唯一资源/对象在服务端权威状态中最多只能成功归属一次，失败客户端应得到一致结果
  evidence:
  - server_state
  - claim_count
  - owners
  - multi_client_video
  default_severity: S1
- id: NET-009
  category: NET
  name: 延迟/抖动/丢包后客户端状态长期无法收敛
  applicable_features:
  - network
  - multiplayer
  - replication
  triggers:
  - latency
  - jitter
  - packet_loss
  - lag_spike
  oracle: 在项目声明的 convergence window 内，连接存活的客户端关键字段最终与权威状态收敛
  evidence:
  - server_snapshot
  - client_snapshots
  - network_profile
  - timestamps
  default_severity: S1
- id: NET-010
  category: NET
  name: 服务端超时或错误响应后客户端永久卡住或不可恢复
  applicable_features:
  - network
  - online_service
  triggers:
  - timeout
  - server_error
  - request_failure
  oracle: 在项目声明超时后客户端必须进入可恢复的失败/重试/返回状态，不得无限等待、输入锁死或崩溃
  evidence:
  - client_state
  - ui_state
  - network_log
  - video
  default_severity: S1
- id: NET-011
  category: NET
  name: 断线重连后生成重复玩家实体或幽灵角色
  applicable_features:
  - multiplayer
  - reconnect
  - spawn
  triggers:
  - disconnect_reconnect
  - session_resume
  oracle: 重连完成后同一玩家的权威玩家实体数量符合项目契约，通常为 1，不得残留重复 avatar/ownership
  evidence:
  - server_entities
  - player_id
  - ownership
  - client_video
  default_severity: S1
- id: NET-012
  category: NET
  name: 重连后重放断线前陈旧输入/技能导致异常移动或重复动作
  applicable_features:
  - multiplayer
  - input
  - reconnect
  triggers:
  - disconnect_while_input
  - reconnect_with_queued_commands
  oracle: 重连后仅接受项目允许的新鲜输入/命令；断线前已过期的输入不得被重复应用
  evidence:
  - input_sequence
  - server_command_log
  - player_state
  - timestamps
  default_severity: S1
- id: NET-013
  category: NET
  name: 房主迁移后权威状态丢失、重置或出现双主
  applicable_features:
  - multiplayer
  - host_client
  - host_migration
  triggers:
  - host_leave
  - host_crash
  - migration
  oracle: 若项目支持房主迁移，迁移后必须只有一个合法新主机且关键权威状态按契约连续；若不支持迁移则必须安全结束/返回
  evidence:
  - host_id
  - server_snapshot
  - session_state
  - multi_client_log
  default_severity: S0
- id: NET-014
  category: NET
  name: 重复包/乱序消息导致非幂等命令重复或错误顺序执行
  applicable_features:
  - network
  - replication
  - commands
  triggers:
  - packet_duplicate
  - packet_reorder
  - retry
  oracle: 对项目声明为幂等或带序列号的命令，重复/乱序传输不得造成重复结算或违反服务器顺序规则
  evidence:
  - sequence_id
  - server_command_log
  - authoritative_state
  - network_profile
  default_severity: S1
- id: NET-015
  category: NET
  name: 多人场景切换不同步导致客户端滞留旧场景或进入错误战局
  applicable_features:
  - network
  - scene_loading
  - multiplayer
  triggers:
  - server_scene_change
  - late_join
  - reconnect_during_scene
  oracle: 在项目声明的场景同步窗口内，所有应在线客户端都进入同一权威场景/关卡实例
  evidence:
  - server_scene
  - client_scenes
  - session_id
  - timestamps
  default_severity: S1
- id: NET-016
  category: NET
  name: 交易/购买与断线竞态造成部分提交或账物不一致
  applicable_features:
  - network
  - shop
  - transaction
  - disconnect
  triggers:
  - purchase_disconnect_race
  - timeout_during_commit
  - disconnect_during_transaction
  oracle: 项目声明原子交易时，竞态终态只能属于允许的完整状态集合（例如完整提交或完全未提交），不得出现扣款与物品/账本分裂。
  evidence:
  - server_ledger
  - account_state
  - request_id
  - branch_timing
  - multi_client_log
  default_severity: S0
- id: NET-017
  category: NET
  name: 同一玩家并发技能/动作请求绕过冷却或一次性执行保护
  applicable_features:
  - network
  - combat
  - skill
  - cooldown
  triggers:
  - simultaneous_skill_request
  - double_click
  - duplicate_command_race
  oracle: 项目声明单次/冷却保护时，同一逻辑动作在同一保护窗口内的权威成功次数不得超过允许值。
  evidence:
  - cast_count
  - cooldown_state
  - server_command_log
  - branch_timing
  default_severity: S1
- id: NET-018
  category: NET
  name: Host Migration 与权威状态写入竞态导致丢更新/回滚/双主
  applicable_features:
  - network
  - host_migration
  - authoritative_state
  triggers:
  - host_leave_during_mutation
  - migration_during_commit
  - host_crash_race
  oracle: 若项目支持迁移，迁移与并发权威写入完成后必须满足单一合法 host 与项目声明的状态连续性/ exactly-once 不变量。
  evidence:
  - host_id
  - authoritative_state
  - mutation_log
  - branch_timing
  - session_log
  default_severity: S0
