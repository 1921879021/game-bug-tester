name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate portable skill structure
        run: ./scripts/check-structure.sh
      - name: Check release-critical files
        run: |
          test -f VERSION
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f RELEASE_NOTES_v1.0.0.md
          test -f docs/QUICKSTART.md
          test -f docs/FAQ.md
          test "$(cat VERSION)" = "1.0.0"
