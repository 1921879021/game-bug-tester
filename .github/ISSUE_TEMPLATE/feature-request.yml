name: Feature request
description: Suggest a new workflow, engine recipe, oracle, or usability improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What testing workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: dependency
    attributes:
      label: Does this require a new mandatory dependency?
      options:
        - "No"
        - "Optional only"
        - "Unsure"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: fallback
    attributes:
      label: Zero-dependency fallback
      description: If the feature needs an optional tool, how should core use degrade gracefully?
